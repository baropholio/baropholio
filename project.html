  <style>
    :root {

<script>
  (function () {
    "use strict";

    var SUPABASE_URL = 'https://fgbnfujztuwvxmbzuhmn.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnYm5mdWp6dHV3dnhtYnp1aG1uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MTcyOTEsImV4cCI6MjEwOTA5MzI5MX0.uetQ4iYWvIROWBpXjQMgKjkoX2loZpxEYTR1_w6YEBM';
    var CACHE_KEY = 'baro_projects_cache_v1';
    var CACHE_TTL_MS = 24 * 60 * 60 * 1000;

    // Custom cursor
    var dot = document.getElementById('dot');
    if (dot && window.matchMedia('(pointer: fine)').matches) {
      window.addEventListener('mousemove', function(e) {
        dot.style.transform = 'translate(' + e.clientX + 'px, ' + e.clientY + 'px)';
      });
    }

    function slugify(text) {
      if (!text) return '';
      return text.toString().toLowerCase()
        .replace(/[àáạảãâầấậẩẫăằắặẳẵ]/g, 'a').replace(/[èéẹẻẽêềếệểễ]/g, 'e')
        .replace(/[ìíịỉĩ]/g, 'i').replace(/[òóọỏõôồốộổỗơờớợởỡ]/g, 'o')
        .replace(/[ùúụủũưừứựửữ]/g, 'u').replace(/[ỳýỵỷỹ]/g, 'y')
        .replace(/đ/g, 'd').replace(/\s+/g, '-').replace(/[^\w\-]+/g, '')
        .replace(/\-\-+/g, '-').replace(/^-+/, '').replace(/-+$/, '');
    }

    function getTargetSlug() {
      var params = new URLSearchParams(window.location.search);
      var q = params.get('slug');
      if (q) return q.trim();

      var path = window.location.pathname;
      var m = path.match(/\/(?:work|project)\/(.+)$/);
      if (m && m[1]) return decodeURIComponent(m[1]).replace(/\.html$/, '').trim();

      return '';
    }

    function findProjectIndex(records, slug) {
      if (!records || !records.length) return -1;
      if (!slug) return 0; // default to first project

      var target = slug.toLowerCase().replace(/^[0-9]+[_-]/, ''); // remove leading 08_ if any
      var targetNum = parseInt(slug.replace(/[^0-9]/g, ''), 10);

      // 1. Exact slug or ID match
      for (var i = 0; i < records.length; i++) {
        var r = records[i];
        var rSlug = (r.slug || '').toLowerCase();
        var rId = String(r.id || '').toLowerCase();
        if (rSlug === slug.toLowerCase() || rId === slug.toLowerCase()) return i;
      }

      // 2. Slugify title match
      for (var j = 0; j < records.length; j++) {
        var sTitle = slugify(records[j].title);
        if (sTitle === slug.toLowerCase() || sTitle === target) return j;
      }

      // 3. Substring / keyword match (e.g. "rocras" in "rocras-reborn...")
      for (var k = 0; k < records.length; k++) {
        var kSlug = (records[k].slug || '').toLowerCase();
        var kTitle = (records[k].title || '').toLowerCase();
        if (kSlug.indexOf(target) !== -1 || target.indexOf(kSlug) !== -1 || kTitle.indexOf(target) !== -1) {
          return k;
        }
      }

      // 4. STT / Number match (e.g. "8" or "08")
      if (!isNaN(targetNum)) {
        for (var n = 0; n < records.length; n++) {
          var sttNum = parseInt(records[n].stt || '', 10);
          if (sttNum === targetNum) return n;
        }
      }

      return 0; // fallback to first
    }

    function normalizeRecord(raw, idx) {
      if (!raw || typeof raw !== 'object') return null;
      var title = raw.title || 'Untitled Project';
      var cat = raw.category || raw.cat ||
        (Array.isArray(raw.collections) && raw.collections[0]) ||
        (Array.isArray(raw.metadata) && (raw.metadata.find(function(m){ return m.key === 'Category'; }) || {}).value) ||
        'ARCHIVE';
      var year = raw.year || raw.date ||
        (Array.isArray(raw.metadata) && (raw.metadata.find(function(m){ return m.key === 'Year'; }) || {}).value) ||
        '2026';
      var org = raw.organization || raw.org ||
        (Array.isArray(raw.metadata) && (raw.metadata.find(function(m){ return m.key === 'Author' || m.key === 'Organization'; }) || {}).value) ||
        'Baropholio';
      var desc = raw.description || raw.desc || '';
      var link = raw.link || '';
      var slug = raw.slug || (raw.seo && raw.seo.slug) || '';

      var image = raw.image || '';
      var video = raw.video || '';
      if (!image && Array.isArray(raw.media) && raw.media.length > 0) {
        var cov = raw.media.find(function(m){ return m && m.isCover; }) || raw.media[0];
        if (cov) image = cov.url || cov.src || cov.dataUrl || '';
      }
      var gallery = Array.isArray(raw.gallery) ? raw.gallery.slice() : [];
      if (gallery.length === 0 && Array.isArray(raw.media) && raw.media.length > 0) {
        gallery = raw.media.map(function(m){
          if (!m) return '';
          if (typeof m === 'string') return m;
          return m.url || m.src || (m.dataUrl && !m.dataUrl.startsWith('data:') ? m.dataUrl : '');
        }).filter(Boolean);
      }
      if (gallery.length === 0 && (image || video)) gallery = [image || video];

      return {
        id: (raw.id != null ? raw.id : idx + 1),
        stt: raw.stt || (idx + 1 < 10 ? '0' + (idx + 1) : String(idx + 1)),
        title: title,
        subtitle: raw.subtitle || '',
        category: cat,
        cat: cat,
        year: year,
        date: year,
        organization: org,
        org: org,
        award: raw.award || '',
        description: desc,
        desc: desc,
        image: image,
        video: video,
        link: link,
        gallery: gallery,
        images: gallery,
        media: raw.media || [],
        collections: Array.isArray(raw.collections) ? raw.collections : [cat],
        basicInfo: Array.isArray(raw.basicInfo) && raw.basicInfo.length > 0 ? raw.basicInfo : (raw.basic_info || raw.metadata || []),
        slug: slug
      };
    }

    function goBackToWork() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        var isFile = window.location.protocol === 'file:';
        window.location.href = isFile ? 'work.html' : '/work';
      }
    }

    function launchShowcase(idx) {
      if (!window.BaroProjectShowcase || typeof window.BaroProjectShowcase.open !== 'function') {
        setTimeout(function() { launchShowcase(idx); }, 40);
        return;
      }

      var loader = document.getElementById('loader');
      if (loader) loader.style.display = 'none';

      var targetIdx = Math.max(0, idx);

      // Open showcase
      window.BaroProjectShowcase.open(targetIdx);

      // Intercept Close Button and Escape to return to /work
      setTimeout(function() {
        var closeBtn = document.getElementById("baroBtnClose");
        if (closeBtn) {
          closeBtn.onclick = function(e) {
            e.preventDefault();
            e.stopPropagation();
            goBackToWork();
          };
        }
      }, 50);

      window.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          goBackToWork();
        }
      }, true);
    }

    async function init() {
      var slug = getTargetSlug();

      // 0. Live sync with Admin CMS localStorage (Authoritative source in VS Code)
      try {
        var adminStorage = localStorage.getItem('baropholio_wix_portfolio_v5');
        if (adminStorage) {
          var parsedAdmin = JSON.parse(adminStorage);
          var pList = Array.isArray(parsedAdmin) ? parsedAdmin : (parsedAdmin.projects || parsedAdmin.records || []);
          if (Array.isArray(pList) && pList.length > 0) {
            var aNorm = pList.map(normalizeRecord).filter(Boolean);
            if (aNorm.length > 0) {
              window.RECORDS = aNorm;
              window.BAROPHOLIO_PROJECTS = aNorm;
              var aIdx = findProjectIndex(window.RECORDS, slug);
              launchShowcase(aIdx);
              return;
            }
          }
        }
      } catch(e) {}

      // 1. Check window.BAROPHOLIO_PROJECTS (from 02.Project/projects_data.js)
      if (window.BAROPHOLIO_PROJECTS && window.BAROPHOLIO_PROJECTS.length > 0) {
        var normalized = window.BAROPHOLIO_PROJECTS.map(normalizeRecord).filter(Boolean);
        window.RECORDS = normalized;
        var idx = findProjectIndex(window.RECORDS, slug);
        launchShowcase(idx);
        return;
      }

      // 2. Check localStorage cache
      try {
        var raw = localStorage.getItem(CACHE_KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.data) && parsed.data.length > 0) {
            var cNorm = parsed.data.map(normalizeRecord).filter(Boolean);
            window.RECORDS = cNorm;
            window.BAROPHOLIO_PROJECTS = cNorm;
            var cIdx = findProjectIndex(window.RECORDS, slug);
            launchShowcase(cIdx);
            return;
          }
        }
      } catch(e) {}

      // 3. Fallback: Supabase Query
      if (window.supabase) {
        try {
          var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          var res = await sb.from('projects')
            .select('*')
            .eq('published', true)
            .order('stt', { ascending: true });

          if (res.data && res.data.length > 0) {
            var mapped = res.data.map(function(row, rIdx) {
              var media = Array.isArray(row.media) ? row.media : (row.media ? [row.media] : []);
              return normalizeRecord({
                id: row.id,
                stt: row.stt,
                slug: row.slug,
                title: row.title,
                subtitle: row.subtitle,
                description: row.description,
                category: (Array.isArray(row.collections) && row.collections[0]) || 'ARCHIVE',
                collections: row.collections,
                basicInfo: row.basic_info,
                media: media
              }, rIdx);
            }).filter(Boolean);

            window.RECORDS = mapped;
            window.BAROPHOLIO_PROJECTS = mapped;
            try {
              localStorage.setItem(CACHE_KEY, JSON.stringify({ timestamp: Date.now(), data: mapped }));
            } catch(e) {}

            var sIdx = findProjectIndex(window.RECORDS, slug);
            launchShowcase(sIdx);
            return;
          }
        } catch(err) {
          console.warn('[Project] Supabase query error:', err);
        }
      }

      // If nothing found at all
      launchShowcase(0);
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

  })();
</script>
  <!-- ============================================================
       CUSTOM DOT SCROLLBAR — replaces all native scrollbars
       with a single tiny dot that travels along a hair-thin track
       ============================================================ -->
  <style>
    /* ── Hide ALL native scrollbars globally ── */
    *,
    *::before,
    *::after {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    html {
      scrollbar-gutter: auto;
    }

    /* ── Dot scrollbar track + dot ── */
    #dot-scroll-track {
      position: fixed;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      width: 1px;
      background: rgba(13, 12, 11, 0.10);
      border-radius: 1px;
      z-index: 9000;
      pointer-events: none;
      opacity: 0;
      transition: opacity .35s ease, height .2s ease;
    }
    #dot-scroll-track.visible {
      opacity: 1;
    }
    #dot-scroll-track.dark {
      background: rgba(255, 255, 255, 0.12);
    }
    #dot-scroll-dot {
      position: absolute;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(13, 12, 11, 0.55);
      transition: background .3s ease, transform .08s linear;
      will-change: transform;
    }
    #dot-scroll-track.dark #dot-scroll-dot {
      background: rgba(255, 255, 255, 0.65);
    }
  </style>

  <div id="dot-scroll-track" aria-hidden="true">
    <div id="dot-scroll-dot"></div>
  </div>

  <script>
    (function () {
      var track  = document.getElementById('dot-scroll-track');
      var dot    = document.getElementById('dot-scroll-dot');
      if (!track || !dot) return;

      var TRACK_H    = 120;
      var HIDE_DELAY = 1200;
      var hideTimer  = null;

      track.style.height = TRACK_H + 'px';

      function show(dark) {
        clearTimeout(hideTimer);
        track.classList.toggle('dark', !!dark);
        track.classList.add('visible');
      }
      function scheduleHide() {
        clearTimeout(hideTimer);
        hideTimer = setTimeout(function () {
          track.classList.remove('visible');
        }, HIDE_DELAY);
      }
      function moveDot(ratio) {
        var dotSize = 3;
        var travel  = TRACK_H - dotSize;
        var y       = Math.max(0, Math.min(travel, ratio * travel));
        dot.style.transform = 'translateX(-50%) translateY(' + y + 'px)';
      }
      function ratio(el) {
        var max = el.scrollHeight - el.clientHeight;
        return max > 0 ? el.scrollTop / max : 0;
      }

      // Window scroll
      window.addEventListener('scroll', function () {
        var max = document.documentElement.scrollHeight - window.innerHeight;
        var r   = max > 0 ? window.scrollY / max : 0;
        moveDot(r);
        show(false);
        scheduleHide();
      }, { passive: true });

      // Panel containers
      function attachPanel(el, dark) {
        if (!el || el._dotScrollBound) return;
        el._dotScrollBound = true;
        el.addEventListener('scroll', function () {
          moveDot(ratio(el));
          show(dark);
          scheduleHide();
        }, { passive: true });
      }

      function attachAll() {
        // Light panels
        var lightSels = ['#grid', '#bookModal', '#work-grid', '.project-detail', '.work-list'];
        lightSels.forEach(function (s) {
          var el = document.querySelector(s);
          if (el) attachPanel(el, false);
        });
        // Dark panels
        var darkSels = ['#about-drawer', '#menu'];
        darkSels.forEach(function (s) {
          var el = document.querySelector(s);
          if (el) attachPanel(el, true);
        });
        // Any remaining overflow-y:auto containers
        var extras = document.querySelectorAll('[style*="overflow-y"]');
        extras.forEach(function (el) { attachPanel(el, false); });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', attachAll);
      } else {
        attachAll();
        setTimeout(attachAll, 1200);
      }
    })();
  </script>
