    async function handleFilesUpload(files) {
      if (!files || files.length === 0 || !state.currentProject) return;
      const p = state.currentProject;
      if (!Array.isArray(p.media)) p.media = [];

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const isImage = file.type.startsWith('image/');
        const isVideo = file.type.startsWith('video/');
        const isAudio = file.type.startsWith('audio/') || /\.(mp3|ogg|wav|aac)$/i.test(file.name);
        if (!isImage && !isVideo && !isAudio) continue;

        try {
          const dataUrl = await optimizeImageToDataUrl(file);
          const isFirst = p.media.length === 0;
          const type = isImage ? 'image' : (isVideo ? 'video' : 'audio');
          p.media.push({
            id: generateUUID(),
            type,
            name: file.name,
            dataUrl,
            isCover: isFirst && isImage,
            alt: file.name.replace(/\.[^/.]+$/, '').replace(/[-_]/g, ' '),
            title: file.name.replace(/\.[^/.]+$/, ''),
            caption: ''
          });
        } catch (e) {
          console.warn('Upload error:', e);
        }
      }
      renderWixMediaGrid();
      showToast('Uploaded ' + files.length + ' media file(s)');
    }

    function optimizeImageToDataUrl(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          if (!file.type.startsWith('image/')) return resolve(e.target.result);
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 1200;
            let width = img.width;
            let height = img.height;
            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.85));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    /* 3. WIX MANAGE MEDIA MODAL */
    function openManageMediaModal(initialSelectIdx = 0) {
      const p = state.currentProject;
      if (!p) return;
      if (!Array.isArray(p.media)) p.media = [];

      let selectedIndex = initialSelectIdx >= 0 && initialSelectIdx < p.media.length ? initialSelectIdx : 0;

      const modalContainer = document.getElementById('modalContainer');
      modalContainer.innerHTML = `
        <div class="modal-backdrop active" id="mediaModalBackdrop">
          <div class="modal-card modal-lg">
            <div class="modal-header">
              <div>
                <h3 style="font-size:18px;">Manage Media</h3>
                <div style="font-size:12.5px; color:var(--text-muted);">Organize gallery images, assign cover, and edit alt text</div>
              </div>
              <div style="display:flex; align-items:center; gap:10px;">
                <button class="btn btn-wix-primary btn-sm" id="btnModalAddMedia">+ Add Media</button>
                <button class="btn-cancel btn-sm" id="btnModalClose">${ICONS.close}</button>
              </div>
            </div>

            <div class="modal-body" style="padding:0; display:grid; grid-template-columns:1fr 300px; min-height:480px;">
              <div style="padding:20px; overflow-y:auto; border-right:1px solid var(--border);" id="mediaModalGallery"></div>
              <div style="padding:20px; background:#f8fafc; display:flex; flex-direction:column; gap:14px;" id="mediaModalDetail"></div>
            </div>

            <div class="modal-footer">
              <button class="btn btn-cancel btn-sm" id="btnModalDone">Done & Apply</button>
            </div>
          </div>
        </div>
      `;

      const refreshGallery = () => {
        const gal = modalContainer.querySelector('#mediaModalGallery');
        const det = modalContainer.querySelector('#mediaModalDetail');
        if (!gal || !det) return;
        gal.innerHTML = '';

        if (p.media.length === 0) {
          gal.innerHTML = '<div style="padding:40px; text-align:center; color:#94a3b8;">No media in this project. Click "+ Add Media" above.</div>';
          det.innerHTML = '';
          return;
        }

        if (selectedIndex >= p.media.length) selectedIndex = p.media.length - 1;
        const currentItem = p.media[selectedIndex];

        gal.style.display = 'grid';
        gal.style.gridTemplateColumns = 'repeat(auto-fill, minmax(130px, 1fr))';
        gal.style.gap = '12px';

        p.media.forEach((item, idx) => {
          const thumb = document.createElement('div');
          thumb.style.aspectRatio = '4/3';
          thumb.style.borderRadius = '8px';
          thumb.style.overflow = 'hidden';
          thumb.style.position = 'relative';
          thumb.style.cursor = 'pointer';
          thumb.style.border = idx === selectedIndex ? '3px solid var(--wix-blue)' : '1px solid var(--border)';
          const mType = item.type || (item.dataUrl && item.dataUrl.startsWith('data:video') ? 'video' : (item.dataUrl && item.dataUrl.startsWith('data:audio') ? 'audio' : 'image'));
          if (mType === 'image') {
            thumb.innerHTML = `<img src="${escapeHtml(item.dataUrl)}" style="width:100%; height:100%; object-fit:cover; display:block;">${item.isCover ? '<div class="cover-badge-pill" style="top:4px; left:4px; font-size:10px;">COVER</div>' : ''}`;
          } else if (mType === 'video') {
            thumb.innerHTML = `<div style="width:100%;height:100%;background:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:20px;gap:4px;"><span>▶</span><span style="font-size:9px;opacity:0.7;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(item.name||'video')}</span></div>`;
          } else {
            thumb.innerHTML = `<div style="width:100%;height:100%;background:#0d0c0b;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e67e22;font-size:20px;gap:4px;"><span>♪</span><span style="font-size:9px;color:#aaa;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(item.name||'audio')}</span></div>`;
          }
          thumb.onclick = () => {
            selectedIndex = idx;
            refreshGallery();
          };
          gal.appendChild(thumb);
        });

        const detType = currentItem.type || (currentItem.dataUrl && currentItem.dataUrl.startsWith('data:video') ? 'video' : (currentItem.dataUrl && currentItem.dataUrl.startsWith('data:audio') ? 'audio' : 'image'));
        let detPreview = '';
        if (detType === 'image') {
          detPreview = `<div style="aspect-ratio:16/9; background:#e2e8f0; border-radius:8px; overflow:hidden;"><img src="${escapeHtml(currentItem.dataUrl)}" style="width:100%; height:100%; object-fit:cover;"></div>`;
        } else if (detType === 'video') {
          detPreview = `<div style="aspect-ratio:16/9; background:#111; border-radius:8px; overflow:hidden;"><video src="${escapeHtml(currentItem.dataUrl)}" controls style="width:100%;height:100%;object-fit:contain;"></video></div>`;
        } else {
          detPreview = `<div style="aspect-ratio:16/9; background:#0d0c0b; border-radius:8px; display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;"><span style="font-size:36px;color:#e67e22;">♪</span><span style="color:#aaa;font-size:12px;text-align:center;max-width:220px;word-break:break-all;">${escapeHtml(currentItem.name||'audio file')}</span><audio src="${escapeHtml(currentItem.dataUrl)}" controls style="width:90%;margin-top:8px;"></audio></div>`;
        }
        det.innerHTML = `
          ${detPreview}

          <label style="display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600; cursor:pointer;">
            <input type="checkbox" id="checkSetCover" ${currentItem.isCover ? 'checked' : ''} ${detType !== 'image' ? 'disabled title="Only images can be cover"' : ''}>
            <span>Set as Cover Image</span>
          </label>

          <div class="form-group" style="margin-bottom:10px;">
            <label class="form-label" style="font-size:12px;">Title</label>
            <input type="text" id="detailTitleInp" value="${escapeHtml(currentItem.title || '')}" placeholder="Image title...">
          </div>

          <div class="form-group" style="margin-bottom:10px;">
            <label class="form-label" style="font-size:12px;">Alt Text (SEO & Accessibility)</label>
            <input type="text" id="detailAltInp" value="${escapeHtml(currentItem.alt || '')}" placeholder="Describe image...">
          </div>

          <div style="margin-top:auto; display:flex; gap:8px;">
            <button class="btn btn-cancel btn-sm" id="btnMoveLeft" title="Move left">← Move</button>
            <button class="btn btn-cancel btn-sm" id="btnMoveRight" title="Move right">Move →</button>
            <button class="btn btn-cancel btn-sm" id="btnDeleteMedia" style="color:var(--danger); border-color:#fecaca;" title="Delete image">Delete</button>
          </div>
        `;

        det.querySelector('#checkSetCover').onchange = (e) => {
          p.media.forEach(m => m.isCover = false);
          currentItem.isCover = e.target.checked;
          if (!currentItem.isCover && p.media.length > 0) p.media[0].isCover = true;
          refreshGallery();
        };

        det.querySelector('#detailTitleInp').oninput = (e) => { currentItem.title = e.target.value; };
        det.querySelector('#detailAltInp').oninput = (e) => { currentItem.alt = e.target.value; };

        det.querySelector('#btnMoveLeft').onclick = () => {
          if (selectedIndex > 0) {
            const temp = p.media[selectedIndex];
            p.media[selectedIndex] = p.media[selectedIndex - 1];
            p.media[selectedIndex - 1] = temp;
            selectedIndex--;
            refreshGallery();
          }
        };

        det.querySelector('#btnMoveRight').onclick = () => {
          if (selectedIndex < p.media.length - 1) {
            const temp = p.media[selectedIndex];
            p.media[selectedIndex] = p.media[selectedIndex + 1];
            p.media[selectedIndex + 1] = temp;
            selectedIndex++;
            refreshGallery();
          }
        };

        det.querySelector('#btnDeleteMedia').onclick = () => {
          p.media.splice(selectedIndex, 1);
          if (p.media.length > 0 && !p.media.some(m => m.isCover)) p.media[0].isCover = true;
          refreshGallery();
        };
      };

      refreshGallery();

      const close = () => {
        modalContainer.innerHTML = '';
        renderWixMediaGrid();
      };

      modalContainer.querySelector('#btnModalClose').onclick = close;
      modalContainer.querySelector('#btnModalDone').onclick = close;
      modalContainer.querySelector('#mediaModalBackdrop').onclick = (e) => {
        if (e.target.id === 'mediaModalBackdrop') close();
      };

      modalContainer.querySelector('#btnModalAddMedia').onclick = () => {
        document.getElementById('mediaFileInput').click();
      };
    }

    /* 4. AI GENERATOR MODAL */
    function openAiGeneratorModal() {
      const p = state.currentProject;
      const modalContainer = document.getElementById('modalContainer');
      modalContainer.innerHTML = `
        <div class="modal-backdrop active" id="aiModalBackdrop">
          <div class="modal-card" style="max-width:560px;">
            <div class="modal-header">
              <h3 style="font-size:18px; display:flex; align-items:center; gap:8px;">
                ${ICONS.sparkle} AI Text Assistant
              </h3>
              <button class="btn-cancel btn-sm" id="btnCloseAiModal">${ICONS.close}</button>
            </div>
            <div class="modal-body">
              <div style="font-size:13.5px; color:var(--text-muted); margin-bottom:14px;">
                Choose an architectural tone for project: <strong>"${escapeHtml(p.title || 'Your Project')}"</strong>
              </div>

              <div class="form-group">
                <label class="form-label">Architectural Voice & Tone</label>
                <select id="selectAiTone">
                  <option value="poetic">Poetic & Sensory Morphology</option>
                  <option value="urban">Hydrological & Ecological Urbanism</option>
                  <option value="technical">Vernacular Materials & Porosity</option>
                  <option value="concise">Concise Architectural Manifesto</option>
                </select>
              </div>

              <div class="form-group" style="margin-bottom:0;">
                <label class="form-label">Generated Preview</label>
                <textarea id="aiGeneratedPreview" rows="6" style="background:#f8fafc; font-size:13.5px; line-height:1.6;"></textarea>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-cancel btn-sm" id="btnRerollAi">🎲 Regenerate</button>
              <button class="btn btn-wix-primary btn-sm" id="btnApplyAiText">Apply to Description</button>
            </div>
          </div>
        </div>
      `;

      const previewBox = modalContainer.querySelector('#aiGeneratedPreview');
      const toneSelect = modalContainer.querySelector('#selectAiTone');

      const generateText = () => {
        const title = p.title || 'This spatial project';
        const tone = toneSelect.value;
        let result = '';
        if (tone === 'poetic') {
          result = `Every journey begins with a shape. Like the first brick laid upon the foundation, ${title} marks the beginning of an unwritten architectural story. These sharp contours and tactile thresholds balance structure and freedom, allowing light and human habitations to coalesce organically.`;
        } else if (tone === 'urban') {
          result = `${title} synthesizes natural riparian hydrology with ecological human settlement patterns. By reclaiming seasonal floodways and introducing porous civic spines, the masterplan integrates polycentric connectivity with resilient public infrastructure.`;
        } else if (tone === 'technical') {
          result = `An inquiry into high-density porosity and micro-climatic adaptability. ${title} utilizes passive wind corridors, vernacular rammed-earth partitions, and strategic interlocking voids to minimize embodied carbon while optimizing cross-ventilation.`;
        } else {
          result = `${title} stands as a testament to persistence and spatial curiosity. It reimagines the everyday urban fabric through tactile materiality, community empowerment, and contemplative geometric proportion.`;
        }
        previewBox.value = result;
      };

      generateText();
      toneSelect.onchange = generateText;
      modalContainer.querySelector('#btnRerollAi').onclick = generateText;

      const close = () => { modalContainer.innerHTML = ''; };
      modalContainer.querySelector('#btnCloseAiModal').onclick = close;
      modalContainer.querySelector('#aiModalBackdrop').onclick = (e) => {
        if (e.target.id === 'aiModalBackdrop') close();
      };

      modalContainer.querySelector('#btnApplyAiText').onclick = () => {
        p.description = previewBox.value;
        const descField = document.getElementById('fieldProjectDesc');
        if (descField) descField.value = previewBox.value;
        close();
        showToast('Applied AI text to description');
      };
    }

    /* 5. SEO & SOCIAL MODAL */
    function openSeoModal() {
      const p = state.currentProject;
      if (!p) return;
      if (!p.seo) p.seo = { metaTitle: '', metaDescription: '', slug: p.slug || generateSlug(p.title) };

      const modalContainer = document.getElementById('modalContainer');
      modalContainer.innerHTML = `
        <div class="modal-backdrop active" id="seoModalBackdrop">
          <div class="modal-card" style="max-width:620px;">
            <div class="modal-header">
              <h3 style="font-size:18px;">SEO & Social Share Settings</h3>
              <button class="btn-cancel btn-sm" id="btnCloseSeoModal">${ICONS.close}</button>
            </div>
            <div class="modal-body">
              <div class="form-group">
                <label class="form-label">URL Slug</label>
                <input type="text" id="seoSlugField" value="${escapeHtml(p.seo.slug || p.slug || '')}" placeholder="project-slug">
                <div style="font-size:12px; color:var(--text-subtle); margin-top:4px;">
                  Public URL: https://baropholio.vn/project/<span id="slugLive">${escapeHtml(p.seo.slug || p.slug || '')}</span>
                </div>
              </div>

              <div class="form-group">
                <div class="form-label-row">
                  <label class="form-label" style="margin:0;">Meta Title</label>
                  <span style="font-size:12px; color:var(--text-muted);" id="titleCount">0 / 60</span>
                </div>
                <input type="text" id="seoTitleField" value="${escapeHtml(p.seo.metaTitle || p.title || '')}" placeholder="Title for Google search results">
              </div>

              <div class="form-group">
                <div class="form-label-row">
                  <label class="form-label" style="margin:0;">Meta Description</label>
                  <span style="font-size:12px; color:var(--text-muted);" id="descCount">0 / 160</span>
                </div>
                <textarea id="seoDescField" rows="3" placeholder="Summary snippet displayed on Google and social cards...">${escapeHtml(p.seo.metaDescription || p.description || '')}</textarea>
              </div>

              <div style="margin-top:20px; padding:14px; background:#f8fafc; border-radius:8px; border:1px solid var(--border);">
                <div style="font-size:11px; font-weight:700; text-transform:uppercase; color:#64748b; margin-bottom:8px;">Google Search Preview</div>
                <div style="font-size:12px; color:#202124;">https://baropholio.vn › project › <span id="prevSlug">${escapeHtml(p.seo.slug || p.slug || '')}</span></div>
                <div style="font-size:16px; color:#1a0dab; font-weight:500; text-decoration:underline; cursor:pointer;" id="prevTitle">${escapeHtml(p.seo.metaTitle || p.title || 'Project Title')}</div>
                <div style="font-size:13px; color:#4d5156; line-height:1.4;" id="prevDesc">${escapeHtml(p.seo.metaDescription || p.description || 'Description will appear here.')}</div>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-wix-primary btn-sm" id="btnSaveSeo">Save SEO Settings</button>
            </div>
          </div>
        </div>
      `;

      const slugInp = modalContainer.querySelector('#seoSlugField');
      const titleInp = modalContainer.querySelector('#seoTitleField');
      const descInp = modalContainer.querySelector('#seoDescField');

      const liveSlug = modalContainer.querySelector('#slugLive');
      const prevSlug = modalContainer.querySelector('#prevSlug');
      const prevTitle = modalContainer.querySelector('#prevTitle');
      const prevDesc = modalContainer.querySelector('#prevDesc');

      slugInp.oninput = (e) => {
        liveSlug.textContent = e.target.value;
        prevSlug.textContent = e.target.value;
      };
      titleInp.oninput = (e) => {
        prevTitle.textContent = e.target.value || 'Project Title';
        modalContainer.querySelector('#titleCount').textContent = e.target.value.length + ' / 60';
      };
      descInp.oninput = (e) => {
        prevDesc.textContent = e.target.value || 'Description will appear here.';
        modalContainer.querySelector('#descCount').textContent = e.target.value.length + ' / 160';
      };

      const close = () => { modalContainer.innerHTML = ''; };
      modalContainer.querySelector('#btnCloseSeoModal').onclick = close;
      modalContainer.querySelector('#seoModalBackdrop').onclick = (e) => {
        if (e.target.id === 'seoModalBackdrop') close();
      };

      modalContainer.querySelector('#btnSaveSeo').onclick = () => {
        p.seo.slug = slugInp.value.trim() || p.slug;
        p.slug = p.seo.slug;
        p.seo.metaTitle = titleInp.value.trim();
        p.seo.metaDescription = descInp.value.trim();
        p.seo.slugEdited = true;
        close();
        showToast('Saved SEO & Social configuration');
      };
    }

    /* 6. ALT TEXT & SHARE & COLLECTION MANAGEMENT MODALS */
    function openAltTextModal() {
      const p = state.currentProject;
      if (!p || !Array.isArray(p.media) || p.media.length === 0) {
        showToast('Please upload project media first');
        return;
      }

      const modalContainer = document.getElementById('modalContainer');
      modalContainer.innerHTML = `
        <div class="modal-backdrop active" id="altModalBackdrop">
          <div class="modal-card" style="max-width:620px;">
            <div class="modal-header">
              <h3 style="font-size:18px;">Image Alt Text</h3>
              <button class="btn-cancel btn-sm" id="btnCloseAltModal">${ICONS.close}</button>
            </div>
            <div class="modal-body" style="display:flex; flex-direction:column; gap:16px;">
              ${p.media.map((item, idx) => `
                <div style="display:flex; gap:14px; align-items:center; border-bottom:1px solid var(--border); padding-bottom:12px;">
                  <img src="${escapeHtml(item.dataUrl)}" style="width:70px; height:50px; object-fit:cover; border-radius:6px;">
                  <div style="flex:1;">
                    <div style="font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:4px;">${escapeHtml(item.name || 'Image ' + (idx + 1))}</div>
                    <input type="text" class="inp-alt-field" data-index="${idx}" value="${escapeHtml(item.alt || '')}" placeholder="Describe this photo for screen readers...">
                  </div>
                </div>
              `).join('')}
            </div>
            <div class="modal-footer">
              <button class="btn btn-wix-primary btn-sm" id="btnSaveAltText">Save Alt Text</button>
            </div>
          </div>
        </div>
      `;

      const close = () => { modalContainer.innerHTML = ''; };
      modalContainer.querySelector('#btnCloseAltModal').onclick = close;
      modalContainer.querySelector('#altModalBackdrop').onclick = (e) => {
        if (e.target.id === 'altModalBackdrop') close();
      };

      modalContainer.querySelector('#btnSaveAltText').onclick = () => {
        modalContainer.querySelectorAll('.inp-alt-field').forEach(inp => {
          const idx = parseInt(inp.dataset.index, 10);
          if (p.media[idx]) p.media[idx].alt = inp.value.trim();
        });
        close();
        showToast('Updated image alt text');
      };
    }

    function openShareModal() {
      const p = state.currentProject;
      const url = `https://baropholio.vn/project/${p.slug || generateSlug(p.title) || 'view'}`;
      navigator.clipboard.writeText(url).then(() => {
        showToast('Copied project link to clipboard: ' + url);
      }).catch(() => {
        prompt('Copy project URL:', url);
      });
    }

    function openManageCollectionModal(colName) {
      const projectsWithCol = state.projects.filter(p => Array.isArray(p.collections) && p.collections.includes(colName));
      const modalContainer = document.getElementById('modalContainer');
      modalContainer.innerHTML = `
        <div class="modal-backdrop active" id="colModalBackdrop">
          <div class="modal-card" style="max-width:480px;">
            <div class="modal-header">
              <h3 style="font-size:18px;">Manage Collection: "${escapeHtml(colName)}"</h3>
              <button class="btn-cancel btn-sm" id="btnCloseColModal">${ICONS.close}</button>
            </div>
            <div class="modal-body">
              <div class="form-group">
                <label class="form-label">Rename Collection</label>
                <input type="text" id="renameColInp" value="${escapeHtml(colName)}">
              </div>

              <div class="form-label">Projects in this collection (${projectsWithCol.length})</div>
              <div style="max-height:160px; overflow-y:auto; border:1px solid var(--border); border-radius:8px; padding:8px 12px; background:#f8fafc;">
                ${projectsWithCol.map(pr => `<div style="font-size:13px; padding:4px 0;">• ${escapeHtml(pr.title)}</div>`).join('') || '<div style="font-size:13px; color:#94a3b8;">No projects currently assigned.</div>'}
              </div>
            </div>
            <div class="modal-footer" style="justify-content:space-between;">
              <button class="btn btn-cancel btn-sm" id="btnDeleteCol" style="color:var(--danger); border-color:#fecaca;">Delete Collection</button>
              <div style="display:flex; gap:8px;">
                <button class="btn btn-cancel btn-sm" id="btnCancelCol">Cancel</button>
                <button class="btn btn-wix-primary btn-sm" id="btnSaveColRename">Save</button>
              </div>
            </div>
          </div>
        </div>
      `;

      const close = () => { modalContainer.innerHTML = ''; };
      modalContainer.querySelector('#btnCloseColModal').onclick = close;
      modalContainer.querySelector('#btnCancelCol').onclick = close;
      modalContainer.querySelector('#colModalBackdrop').onclick = (e) => {
        if (e.target.id === 'colModalBackdrop') close();
      };

      modalContainer.querySelector('#btnSaveColRename').onclick = () => {
        const newName = modalContainer.querySelector('#renameColInp').value.trim();
        if (newName && newName !== colName) {
          const idx = state.collections.indexOf(colName);
          if (idx >= 0) state.collections[idx] = newName;
          state.projects.forEach(pr => {
            if (Array.isArray(pr.collections)) {
              pr.collections = pr.collections.map(c => c === colName ? newName : c);
            }
          });
          saveState(false);
          render();
          showToast('Renamed collection to: ' + newName);
        }
        close();
      };

      modalContainer.querySelector('#btnDeleteCol').onclick = () => {
        if (confirm(`Delete collection "${colName}"? Projects will remain untouched.`)) {
          state.collections = state.collections.filter(c => c !== colName);
          state.projects.forEach(pr => {
            if (Array.isArray(pr.collections)) {
              pr.collections = pr.collections.filter(c => c !== colName);
            }
          });
          saveState(false);
          render();
          showToast('Deleted collection: ' + colName);
          close();
        }
      };
    }

    /* 7. LIVE PORTFOLIO PREVIEW MODAL */
    function openPreviewModal(project) {
      const coverImg = project.media?.find(m => m.isCover)?.dataUrl || (project.media[0] ? project.media[0].dataUrl : '');
      const modalContainer = document.getElementById('modalContainer');
      modalContainer.innerHTML = `
        <div class="modal-backdrop active" id="previewModalBackdrop">
          <div class="modal-card modal-lg" style="max-width:880px;">
            <div class="modal-header">
              <h3 style="font-size:18px;">Portfolio Live Preview: "${escapeHtml(project.title)}"</h3>
              <button class="btn-cancel btn-sm" id="btnClosePreviewModal">${ICONS.close}</button>
            </div>
            <div class="modal-body" style="background:#f2f0ec; padding:32px;">
              <div style="background:#ffffff; border-radius:12px; padding:28px; box-shadow:var(--shadow-lg);">
                <div style="font-size:12px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--accent); margin-bottom:8px;">
                  ${(project.collections || [])[0] || 'ARCHIVE'}
                </div>
                <h1 style="font-family:var(--font-display); font-size:28px; font-weight:700; color:#0d0c0b; margin-bottom:16px;">
                  ${escapeHtml(project.title)}
                </h1>

                ${coverImg ? `
                  <div style="aspect-ratio:16/9; border-radius:8px; overflow:hidden; margin-bottom:20px; background:#e2e8f0;">
                    <img src="${escapeHtml(coverImg)}" style="width:100%; height:100%; object-fit:cover;">
                  </div>
                ` : ''}

                <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:12px; padding:16px; background:#f8fafc; border-radius:8px; margin-bottom:20px;">
                  ${(project.basicInfo || []).map(b => `
                    <div>
                      <div style="font-size:11px; text-transform:uppercase; color:#64748b; font-weight:700;">${escapeHtml(b.label)}</div>
                      <div style="font-size:13.5px; font-weight:600; color:#1e293b;">${escapeHtml(b.value)}</div>
                    </div>
                  `).join('')}
                </div>

                <div style="font-size:15px; line-height:1.75; color:#334155; white-space:pre-wrap;">
                  ${escapeHtml(project.description)}
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-wix-primary btn-sm" id="btnPreviewDone">Close Preview</button>
            </div>
          </div>
        </div>
      `;

      const close = () => { modalContainer.innerHTML = ''; };
      modalContainer.querySelector('#btnClosePreviewModal').onclick = close;
      modalContainer.querySelector('#btnPreviewDone').onclick = close;
      modalContainer.querySelector('#previewModalBackdrop').onclick = (e) => {
        if (e.target.id === 'previewModalBackdrop') close();
      };
    }

    /* 8. PROJECT ACTIONS */
    function startNewProject() {
      state.currentProject = {
        id: generateUUID(),
        stt: '',
        slug: '',
        title: '',
        subtitle: '',
        description: '',
        published: true,
        collections: ["Orange~"],
        basicInfo: [
          { id: generateUUID(), label: "Date", value: new Date().getFullYear().toString() },
          { id: generateUUID(), label: "Location", value: "Ho Chi Minh City" },
          { id: generateUUID(), label: "Role", value: "Lead Spatial Designer" },
          { id: generateUUID(), label: "Project type", value: "Architecture & Branding" }
        ],
        media: [],
        seo: { metaTitle: "", metaDescription: "", slug: "" },
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
      state.view = 'edit';
      render();
    }

    function openEditProject(id) {
      const proj = state.projects.find(p => p.id === id);
      if (!proj) return;
      state.currentProject = JSON.parse(JSON.stringify(proj));
      state.view = 'edit';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function duplicateCurrentProject() {
      const p = state.currentProject;
      if (!p) return;
      const copy = JSON.parse(JSON.stringify(p));
      copy.id = generateUUID();
      copy.title = (copy.title || 'Untitled') + ' (Copy)';
      copy.slug = generateSlug(copy.title);
      if (copy.seo) copy.seo.slug = copy.slug;
      state.projects.unshift(copy);
      state.currentProject = copy;
      saveState(false);
      render();
      showToast('Duplicated project: ' + copy.title);
    }

    async function saveAndCloseProject() {
      const p = state.currentProject;
      if (!p) return;
      if (!p.title || !p.title.trim()) {
        alert('Please enter a project title before saving.');
        document.getElementById('fieldProjectTitle')?.focus();
        return;
      }

      if (!p.slug) p.slug = generateSlug(p.title);
      p.updatedAt = new Date().toISOString();

      const existingIdx = state.projects.findIndex(item => item.id === p.id);
      if (existingIdx >= 0) {
        state.projects[existingIdx] = p;
      } else {
        state.projects.unshift(p);
      }

      saveState(false);

      if (state.dirHandle) {
        await syncToProjectDirectory();
      }

      state.view = 'list';
      state.currentProject = null;
      render();
      showToast(`Saved project "${p.title}" successfully!`);
    }

    function confirmLeaveEdit() {
      if (confirm('Discard unsaved changes and return to project dashboard?')) {
        state.view = 'list';
        state.currentProject = null;
        render();
      }
    }

    function confirmDeleteProject(proj) {
      return softDeleteProject(proj);
    }
    function legacyDeleteProject(proj) {
      if (confirm(`Permanently delete project "${proj.title || 'Untitled'}"? This action cannot be undone.`)) {
        state.projects = state.projects.filter(p => p.id !== proj.id);
        saveState(false);
        if (state.currentProject && state.currentProject.id === proj.id) {
          state.currentProject = null;
          state.view = 'list';
        }
        render();
        showToast('Deleted: ' + (proj.title || 'Project'));
      }
    }

    /* INITIALIZATION */
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('importJsonInput').onchange = (e) => {
        if (e.target.files && e.target.files[0]) {
          handleImportJson(e.target.files[0]);
          e.target.value = '';
        }
      };

      document.getElementById('mediaFileInput').onchange = (e) => {
        if (e.target.files && e.target.files.length > 0) {
          handleFilesUpload(e.target.files);
          e.target.value = '';
        }
      };

      loadState();
      state.view = 'list';
      state.currentProject = null;
      render();
    });
  </script>
</body>
