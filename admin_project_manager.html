    /* Row More Options Menu */
    function openRowMoreMenu(project, buttonEl) {
      document.querySelectorAll('.row-more-menu').forEach(el => el.remove());

      const menu = document.createElement('div');
      menu.className = 'row-more-menu';

      menu.innerHTML = `
        <div class="row-more-menu-item" data-action="edit">
          <span>✏️ Edit Project</span>
        </div>
        <div class="row-more-menu-item" data-action="preview">
          <span>👁️ Preview in Portfolio</span>
        </div>
        <div class="row-more-menu-item" data-action="duplicate">
          <span>📄 Duplicate</span>
        </div>
        <div class="row-more-menu-item" data-action="toggle-pub">
          <span>${project.published ? '👁️‍🗨️ Hide from Site' : '🌐 Publish to Site'}</span>
        </div>
        <div class="row-more-menu-item danger" data-action="soft-delete">
          <span>🗑️ Move to 06.Trash</span>
        </div>
      `;

      const rect = buttonEl.getBoundingClientRect();
      menu.style.position = 'fixed';
      menu.style.top = (rect.bottom + 4) + 'px';
      menu.style.right = (window.innerWidth - rect.right) + 'px';

      menu.querySelector('[data-action="edit"]').onclick = () => {
        menu.remove();
        openEditProject(project.id);
      };
      menu.querySelector('[data-action="preview"]').onclick = () => {
        menu.remove();
        openPreviewModal(project);
      };
      menu.querySelector('[data-action="duplicate"]').onclick = () => {
        menu.remove();
        const dup = deepCopy(project);
        dup.id = generateUUID();
        dup.title = (project.title || 'Project') + ' (Copy)';
        dup.slug = generateSlug(dup.title);
        dup.createdAt = new Date().toISOString();
        dup.updatedAt = new Date().toISOString();
        state.projects.unshift(dup);
        saveState(true);
        render();
        saveProjectToSupabase(dup).catch(e => console.warn('[Supabase] duplicate sync error:', e));
        showToast('Duplicated project!');
      };
      menu.querySelector('[data-action="toggle-pub"]').onclick = () => {
        menu.remove();
        project.published = !project.published;
        saveState(true);
        render();
        saveProjectToSupabase(project).catch(e => console.warn('[Supabase] toggle-pub sync error:', e));
        showToast(project.published ? 'Project published!' : 'Project hidden.');
      };
      menu.querySelector('[data-action="soft-delete"]').onclick = () => {
        menu.remove();
        softDeleteProject(project);
      };

      document.body.appendChild(menu);

      const closeHandler = (e) => {
        if (!menu.contains(e.target)) {
          menu.remove();
          document.removeEventListener('click', closeHandler);
        }
      };
      setTimeout(() => document.addEventListener('click', closeHandler), 10);
    }

              </div>

                ${state.collections.map(c => {
                  const count = state.projects.filter(p => Array.isArray(p.collections) && p.collections.includes(c)).length;
                  return `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid rgba(13,12,11,0.06);">
                      <div style="display:flex; align-items:center; gap:8px;">
                        <span style="font-size:13.5px; font-weight:600; color:var(--text);">${escapeHtml(c)}</span>
                        <span style="font-size:11.5px; padding:2px 7px; border-radius:10px; background:#f0eee8; color:#666;">${count} ${count === 1 ? 'project' : 'projects'}</span>
                      </div>
                      <div style="display:flex; gap:6px;">
                        <button class="btn btn-cancel btn-sm btn-rename-col" data-col="${escapeHtml(c)}" style="padding:3px 10px; font-size:12px;">Rename</button>
                        <button class="btn btn-cancel btn-sm btn-delete-col" data-col="${escapeHtml(c)}" style="padding:3px 8px; font-size:12px; color:var(--danger); border-color:#fecaca;">${ICONS.trash}</button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
            <div class="modal-footer" style="justify-content:flex-end;">
              <button class="btn btn-baro-primary btn-sm" id="btnDoneCollections">Done</button>
            </div>
          </div>
        </div>
      `;

      const close = () => { modalContainer.innerHTML = ''; };
      modalContainer.querySelector('#btnCloseAllColModal').onclick = close;
      modalContainer.querySelector('#btnDoneCollections').onclick = close;
      modalContainer.querySelector('#allColModalBackdrop').onclick = (e) => {
        if (e.target.id === 'allColModalBackdrop') close();
      };

      // Add collection
      const addBtn = modalContainer.querySelector('#btnAddNewCollection');
      const addInput = modalContainer.querySelector('#newCollectionInput');
      const handleAdd = () => {
        const val = addInput.value.trim();
        if (val && !state.collections.includes(val)) {
          state.collections.push(val);
          saveState(false);
          openManageAllCollectionsModal();
          showToast(`Added collection "${val}"`);
        }
      };
      addBtn.onclick = handleAdd;
      addInput.onkeydown = (e) => { if (e.key === 'Enter') handleAdd(); };

      // Rename collection
      modalContainer.querySelectorAll('.btn-rename-col').forEach(btn => {
        btn.onclick = () => {
          const oldName = btn.getAttribute('data-col');
          const newName = prompt('Enter new collection name:', oldName);
          if (newName && newName.trim() && newName.trim() !== oldName) {
            const cleanNew = newName.trim();
            const idx = state.collections.indexOf(oldName);
            if (idx >= 0) state.collections[idx] = cleanNew;
            state.projects.forEach(p => {
              if (Array.isArray(p.collections)) {
                p.collections = p.collections.map(c => c === oldName ? cleanNew : c);
              }
            });
            saveState(false);
            openManageAllCollectionsModal();
            showToast(`Renamed to "${cleanNew}"`);
          }
        };
      });

      // Delete collection
      modalContainer.querySelectorAll('.btn-delete-col').forEach(btn => {
        btn.onclick = () => {
          const colName = btn.getAttribute('data-col');
          if (confirm(`Delete collection "${colName}"? Projects will remain untouched.`)) {
            state.collections = state.collections.filter(c => c !== colName);
            state.projects.forEach(p => {
              if (Array.isArray(p.collections)) {
                p.collections = p.collections.filter(c => c !== colName);
              }
            });
            saveState(false);
            openManageAllCollectionsModal();
            showToast(`Removed collection "${colName}"`);
          }
        };
      });
    }

    function renderBasicInfoItems() {
      const container = document.getElementById('basicInfoList');
      if (!container || !state.currentProject) return;
      container.innerHTML = '';
      const p = state.currentProject;
      if (!Array.isArray(p.basicInfo)) p.basicInfo = [];

      p.basicInfo.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'basic-info-row';
        row.draggable = true;
        row.dataset.index = index;

        row.innerHTML = `
          <div class="drag-handle" title="Drag to reorder">${ICONS.drag}</div>
          <div class="info-label-cell" contenteditable="true" title="Click to edit label">${escapeHtml(item.label || 'Item')}</div>
          <div class="info-value-cell">
            <input type="text" value="${escapeHtml(item.value || '')}" placeholder="Enter detail...">
          </div>
          <div class="row-more-btn" data-btn="more">${ICONS.more}
            <div class="row-action-popover">
              <div class="row-popover-item" data-action="rename">✏️ Edit Label</div>
              <div class="row-popover-item" data-action="duplicate">📄 Duplicate</div>
              <div class="row-popover-item danger-text" data-action="delete">🗑️ Delete</div>
            </div>
          </div>
        `;

        const valInp = row.querySelector('input');
        valInp.oninput = (e) => { item.value = e.target.value; };

        const labelCell = row.querySelector('.info-label-cell');
        labelCell.onblur = (e) => { item.label = e.target.textContent.trim() || 'Item'; };

        const moreBtn = row.querySelector('[data-btn="more"]');
        const popover = row.querySelector('.row-action-popover');
        moreBtn.onclick = (e) => {
          e.stopPropagation();
          document.querySelectorAll('.row-action-popover').forEach(p => p !== popover && p.classList.remove('show'));
          popover.classList.toggle('show');
        };

        row.querySelector('[data-action="rename"]').onclick = () => {
          popover.classList.remove('show');
          labelCell.focus();
        };
        row.querySelector('[data-action="duplicate"]').onclick = () => {
          popover.classList.remove('show');
          p.basicInfo.splice(index + 1, 0, { id: generateUUID(), label: item.label, value: item.value });
          renderBasicInfoItems();
        };
        row.querySelector('[data-action="delete"]').onclick = () => {
          popover.classList.remove('show');
          p.basicInfo.splice(index, 1);
          renderBasicInfoItems();
        };

        row.ondragstart = (e) => {
          row.classList.add('dragging');
          e.dataTransfer.setData('text/plain', index);
        };
        row.ondragend = () => row.classList.remove('dragging');
        row.ondragover = (e) => e.preventDefault();
        row.ondrop = (e) => {
          e.preventDefault();
          const fromIndex = parseInt(e.dataTransfer.getData('text/plain'), 10);
          const toIndex = index;
          if (fromIndex !== toIndex) {
            const moved = p.basicInfo.splice(fromIndex, 1)[0];
            p.basicInfo.splice(toIndex, 0, moved);
            renderBasicInfoItems();
          }
        };

        container.appendChild(row);
      });
    }

    async function handleFilesUpload(files) {
      if (!files || files.length === 0 || !state.currentProject) return;
      const p = state.currentProject;
      if (!Array.isArray(p.media)) p.media = [];

      // File size warnings
      for (let i = 0; i < files.length; i++) {
        const f = files[i];
        if (f.type.startsWith('video/') && f.size > 50 * 1024 * 1024) {
          showToast(`⚠️ Video "${f.name}" vượt 50MB — có thể upload chậm.`);
        } else if (f.type.startsWith('image/') && f.size > 10 * 1024 * 1024) {
          showToast(`⚠️ Ảnh "${f.name}" vượt 10MB — sẽ nén trước khi lưu.`);
        }
      }

      // Tạo slug nếu chưa có (dùng làm tên thư mục Storage)
      if (!p.slug && p.title) p.slug = p.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

      const sb = getSupabase();

      // ── Build upload queue UI ──────────────────────────────────────────────
      let queueContainer = document.getElementById('uploadQueueContainer');
      if (!queueContainer) {
        queueContainer = document.createElement('div');
        queueContainer.id = 'uploadQueueContainer';
        queueContainer.style.cssText = 'margin:10px 0; display:flex; flex-direction:column; gap:8px;';
        const dropZone = document.getElementById('mediaDropZone');
        if (dropZone && dropZone.parentNode) {
          dropZone.parentNode.insertBefore(queueContainer, dropZone.nextSibling);
        }
      }

      const fileList = Array.from(files).filter(f => {
        const isImage = f.type.startsWith('image/') && f.type !== 'image/gif';
        const isGif   = f.type === 'image/gif';
        const isVideo = f.type.startsWith('video/');
        const isAudio = f.type.startsWith('audio/') || /\.(mp3|ogg|wav|aac)$/i.test(f.name);
        const isPdf   = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
        return isImage || isGif || isVideo || isAudio || isPdf;
      });

      if (fileList.length === 0) { showToast('Không có file hợp lệ.'); return; }

      // Render queue rows
      const rowMap = {};
      fileList.forEach((file, idx) => {
        const rowId = 'uq_' + idx + '_' + Date.now();
        const row = document.createElement('div');
        row.id = rowId;
        row.style.cssText = 'background:var(--surface,#f5f5f5); border:1px solid var(--border,#ddd); border-radius:8px; padding:8px 12px; font-size:12px;';
        row.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
            <span style="font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:70%;">${file.name}</span>
            <span id="${rowId}_status" style="color:var(--text-muted,#888); font-size:11px;">Đang chờ...</span>
          </div>
          <div style="background:#e0e0e0; border-radius:4px; height:5px; overflow:hidden;">
            <div id="${rowId}_bar" style="height:100%; width:0%; background:#ea580c; transition:width 0.2s ease; border-radius:4px;"></div>
          </div>`;
        queueContainer.appendChild(row);
        rowMap[idx] = { rowId };
      });

      let uploadedCount = 0;

      for (let i = 0; i < fileList.length; i++) {
        const file = fileList[i];
        const { rowId } = rowMap[i];
        const statusEl = document.getElementById(rowId + '_status');
        const barEl    = document.getElementById(rowId + '_bar');

        const isImage = file.type.startsWith('image/') && file.type !== 'image/gif';
        const isGif   = file.type === 'image/gif';
        const isVideo = file.type.startsWith('video/');
        const isAudio = file.type.startsWith('audio/') || /\.(mp3|ogg|wav|aac)$/i.test(file.name);
        const isPdf   = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
        const type    = isImage ? 'image' : isGif ? 'gif' : isVideo ? 'video' : isAudio ? 'audio' : 'pdf';
        const isFirst = p.media.length === 0;
        const mediaId = generateUUID();
        const ext     = file.name.split('.').pop().toLowerCase();
        const storagePath = p.slug ? `${p.slug}/${mediaId}.${ext}` : `uploads/${mediaId}.${ext}`;

        try {
          if (statusEl) statusEl.textContent = 'Đang upload...';
          if (barEl) barEl.style.width = '10%';

          let publicUrl = null;
          if (sb && p.slug) {
            const { error: upErr } = await sb.storage.from('project-media').upload(storagePath, file, { upsert: true, contentType: file.type });
            if (!upErr) {
              if (barEl) barEl.style.width = '80%';
              const { data: urlData } = sb.storage.from('project-media').getPublicUrl(storagePath);
              publicUrl = urlData?.publicUrl || null;
              if (barEl) barEl.style.width = '100%';
              if (statusEl) { statusEl.textContent = '✓ Cloud'; statusEl.style.color = '#16a34a'; }
            } else {
              console.warn('[Storage] Upload lỗi, fallback dataUrl:', upErr.message);
              if (statusEl) statusEl.textContent = 'Cloud lỗi, lưu local...';
            }
          }

          // Fallback: dataUrl nếu Storage thất bại hoặc chưa có slug
          const dataUrl = publicUrl ? null : await optimizeImageToDataUrl(file);
          if (!publicUrl) {
            if (barEl) barEl.style.width = '100%';
            if (statusEl) { statusEl.textContent = '✓ Local'; statusEl.style.color = '#ca8a04'; }
          }

          // MERGE vào mảng media hiện có (không xóa media cũ)
          p.media.push({
            id: mediaId,
            type,
            name: file.name,
            url: publicUrl,
            dataUrl: dataUrl,
            isCover: isFirst && isImage,
            alt: file.name.replace(/\.[^/.]+$/, '').replace(/[-_]/g, ' '),
            title: file.name.replace(/\.[^/.]+$/, ''),
            caption: ''
          });
          uploadedCount++;
        } catch (e) {
          console.warn('Upload error:', e);
          if (statusEl) { statusEl.textContent = '✗ Lỗi'; statusEl.style.color = '#dc2626'; }
          if (barEl) { barEl.style.background = '#dc2626'; barEl.style.width = '100%'; }
        }
      }

      renderWixMediaGrid();
      const toCloud = p.slug && sb ? ` → Supabase Storage (${p.slug}/)` : ' (local preview)';
      showToast(`Đã upload ${uploadedCount}/${fileList.length} file${toCloud}`);

      // Auto-remove queue UI after 4s
      setTimeout(() => {
        if (queueContainer && queueContainer.parentNode) {
          queueContainer.innerHTML = '';
        }
      }, 4000);
    }

    function optimizeImageToDataUrl(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          // GIF: preserve as-is (no canvas — would lose animation)
          // Audio, Video, PDF: return raw base64 data URL
          if (file.type === 'image/gif' ||
              file.type.startsWith('audio/') || /\.(mp3|ogg|wav|aac)$/i.test(file.name) ||
              file.type.startsWith('video/') ||
              file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
            return resolve(e.target.result);
          }
          // Static images: resize to max 1200px, compress
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 1200;
            let width = img.width;
            let height = img.height;
            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.85));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

            thumb.innerHTML = `<div style="width:100%;height:100%;background:#0d0c0b;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e67e22;font-size:20px;gap:4px;"><span>♪</span><span style="font-size:9px;color:#aaa;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(item.name||'audio')}</span></div>`;
          } else if (mType === 'pdf') {
            thumb.innerHTML = `<div style="width:100%;height:100%;background:#fff1f2;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ef4444;font-size:20px;gap:4px;"><span>📄</span><span style="font-size:9px;color:#888;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(item.name||'PDF')}</span></div>`;
          }
          thumb.onclick = () => {
            selectedIndex = idx;
            refreshGallery();
          };
          gal.appendChild(thumb);
        });

        const detType = currentItem.type || (currentItem.dataUrl && currentItem.dataUrl.startsWith('data:video') ? 'video' : (currentItem.dataUrl && currentItem.dataUrl.startsWith('data:audio') ? 'audio' : (currentItem.dataUrl && currentItem.dataUrl.startsWith('data:application/pdf') ? 'pdf' : 'image')));

        if (detType === 'image') {
          detPreview = `<div style="aspect-ratio:16/9; background:#e2e8f0; border-radius:8px; overflow:hidden;"><img src="${escapeHtml(currentItem.dataUrl)}" style="width:100%; height:100%; object-fit:cover;"></div>`;
        } else if (detType === 'gif') {
          detPreview = `<div style="aspect-ratio:16/9; background:#e2e8f0; border-radius:8px; overflow:hidden;"><img src="${escapeHtml(currentItem.dataUrl)}" style="width:100%; height:100%; object-fit:contain;"></div>`;
        } else if (detType === 'video') {
          detPreview = `<div style="aspect-ratio:16/9; background:#111; border-radius:8px; overflow:hidden;"><video src="${escapeHtml(currentItem.dataUrl)}" controls style="width:100%;height:100%;object-fit:contain;"></video></div>`;
        } else if (detType === 'audio') {
          detPreview = `<div style="aspect-ratio:16/9; background:#0d0c0b; border-radius:8px; display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;"><span style="font-size:36px;color:#e67e22;">♪</span><span style="color:#aaa;font-size:12px;text-align:center;max-width:220px;word-break:break-all;">${escapeHtml(currentItem.name||'audio file')}</span><audio src="${escapeHtml(currentItem.dataUrl)}" controls style="width:90%;margin-top:8px;"></audio></div>`;
        } else if (detType === 'pdf') {
          detPreview = `<div style="aspect-ratio:16/9; background:#fff1f2; border-radius:8px; display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;"><span style="font-size:36px;">📄</span><span style="color:#666;font-size:12px;text-align:center;max-width:220px;word-break:break-all;">${escapeHtml(currentItem.name||'PDF file')}</span><a href="${escapeHtml(currentItem.dataUrl)}" target="_blank" style="font-size:12px;color:#ef4444;text-decoration:underline;margin-top:4px;">Open PDF ↗</a></div>`;
        }
        det.innerHTML = `
          ${detPreview}

          <label style="display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600; cursor:pointer;">
            <input type="checkbox" id="checkSetCover" ${currentItem.isCover ? 'checked' : ''} ${(detType !== 'image' && detType !== 'gif') ? 'disabled title="Only images/GIFs can be cover"' : ''}>
            <span>Set as Cover Image</span>
          </label>

          <div class="form-group" style="margin-bottom:10px;">
            <label class="form-label" style="font-size:12px;">Title</label>
            <input type="text" id="detailTitleInp" value="${escapeHtml(currentItem.title || '')}" placeholder="Image title...">
          </div>

          <div class="form-group" style="margin-bottom:10px;">
            <label class="form-label" style="font-size:12px;">Alt Text (SEO & Accessibility)</label>
            <input type="text" id="detailAltInp" value="${escapeHtml(currentItem.alt || '')}" placeholder="Describe image...">
          </div>

          <div class="form-group" style="margin-bottom:10px;">
            <label class="form-label" style="font-size:12px;">Source Path / Direct URL</label>
            <div style="display:flex; gap:6px;">
              <input type="text" id="detailItemPathInp" value="${escapeHtml(currentItem.dataUrl || '')}" style="font-size:11.5px; font-family:monospace; padding:6px 8px;">
              <button type="button" class="btn btn-outline-pill btn-sm" id="btnUpdateItemPath" style="white-space:nowrap;">Update</button>
            </div>
          </div>

          <div style="margin-top:auto; display:flex; gap:8px;">
            <button class="btn btn-cancel btn-sm" id="btnMoveLeft" title="Move left">← Move</button>
            <button class="btn btn-cancel btn-sm" id="btnMoveRight" title="Move right">Move →</button>
            <button class="btn btn-cancel btn-sm" id="btnDeleteMedia" style="color:var(--danger); border-color:#fecaca;" title="Delete image">Delete</button>
          </div>
        `;

        det.querySelector('#checkSetCover').onchange = (e) => {
          p.media.forEach(m => m.isCover = false);
          currentItem.isCover = e.target.checked;
          if (!currentItem.isCover && p.media.length > 0) p.media[0].isCover = true;
          refreshGallery();
        };

        det.querySelector('#detailTitleInp').oninput = (e) => { currentItem.title = e.target.value; };
        det.querySelector('#detailAltInp').oninput = (e) => { currentItem.alt = e.target.value; };

        det.querySelector('#btnMoveLeft').onclick = () => {
          if (selectedIndex > 0) {
            const temp = p.media[selectedIndex];
            p.media[selectedIndex] = p.media[selectedIndex - 1];
            p.media[selectedIndex - 1] = temp;
            selectedIndex--;
            refreshGallery();
          }
        };

        det.querySelector('#btnMoveRight').onclick = () => {
          if (selectedIndex < p.media.length - 1) {
            const temp = p.media[selectedIndex];
            p.media[selectedIndex] = p.media[selectedIndex + 1];
            p.media[selectedIndex + 1] = temp;
            selectedIndex++;
            refreshGallery();
          }
        };

        det.querySelector('#btnDeleteMedia').onclick = async () => {
          const itemToDelete = p.media[selectedIndex];
          if (!itemToDelete) return;

          let storageDeleted = false;
          const itemUrl = itemToDelete.dataUrl || itemToDelete.url || itemToDelete.src || '';
          const isSupabaseStorage = typeof itemUrl === 'string' && (itemUrl.includes('/storage/v1/object/public/') || itemUrl.includes('/storage/v1/'));

          if (isSupabaseStorage) {
            showToast('Đang xóa file trên Supabase Storage...');
            const res = await deleteMediaFromSupabaseStorage(itemToDelete);
            if (res.deleted) {
              storageDeleted = true;
            } else if (res.error) {
              showToast('Lỗi xóa file Storage: ' + res.error);
            }
          }

          p.media.splice(selectedIndex, 1);
          if (p.media.length > 0 && !p.media.some(m => m.isCover)) p.media[0].isCover = true;
          saveState(false);
          refreshGallery();

          // Cập nhật Database nếu project đã lưu trên Supabase
          if (isValidUUID(p.id) || p.id) {
            try {
              await saveProjectToSupabase(p);
            } catch (e) {
              console.warn('[Supabase] Sync media delete error:', e);
            }
          }

          if (storageDeleted) {
            showToast('Đã xóa vĩnh viễn file gốc trên Supabase Storage & Cập nhật Database thành công!');
          } else {
            showToast('Đã xóa media khỏi dự án');
          }
        };

        const btnUpdatePath = det.querySelector('#btnUpdateItemPath');
        const inpDetailPath = det.querySelector('#detailItemPathInp');
        if (btnUpdatePath && inpDetailPath) {
          btnUpdatePath.onclick = () => {
            const val = inpDetailPath.value.trim();
            if (val) {
              currentItem.dataUrl = val;
              currentItem.type = detectMediaTypeFromUrl(val);
              if (currentItem.isCover) p.coverImage = val;
              refreshGallery();
              showToast('Updated asset source');
            }
          };
          inpDetailPath.onkeydown = (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              btnUpdatePath.click();
            }
          };
        }
      };

      refreshGallery();

      const close = () => {
        modalContainer.innerHTML = '';
        renderWixMediaGrid();
      };

      modalContainer.querySelector('#btnModalClose').onclick = close;
      modalContainer.querySelector('#btnModalDone').onclick = close;
      modalContainer.querySelector('#mediaModalBackdrop').onclick = (e) => {
        if (e.target.id === 'mediaModalBackdrop') close();
      };

      modalContainer.querySelector('#btnModalAddMedia').onclick = () => {
        document.getElementById('mediaFileInput').click();
      };

      const btnAddPath = modalContainer.querySelector('#btnModalAddPath');
      if (btnAddPath) {
        btnAddPath.onclick = () => {
          const val = prompt('Enter relative file path or direct URL:\n(e.g. 02.Project/PR-23/video.mp4)');
          if (val && val.trim()) {
            addMediaByPath(val.trim());
            selectedIndex = (p.media || []).length - 1;
            refreshGallery();
          }
        };
      }
    }

        };
        swatchesBox.appendChild(btn);
      });

      const close = () => { modalContainer.innerHTML = ''; };
      modalContainer.querySelector('#btnCloseColModal').onclick = close;
      modalContainer.querySelector('#btnCancelCol').onclick = close;
      modalContainer.querySelector('#colModalBackdrop').onclick = (e) => {
        if (e.target.id === 'colModalBackdrop') close();
      };

      modalContainer.querySelector('#btnSaveColRename').onclick = () => {
        const newName = modalContainer.querySelector('#renameColInp').value.trim();
        const pinChecked = modalContainer.querySelector('#chkPinCollection').checked;
        const targetName = newName || colName;

        if (newName && newName !== colName) {
          const idx = state.collections.indexOf(colName);
          if (idx >= 0) state.collections[idx] = newName;
          state.projects.forEach(pr => {
            if (Array.isArray(pr.collections)) {
              pr.collections = pr.collections.map(c => c === colName ? newName : c);
            }
          });
          delete state.collectionMeta[colName];
        }

        state.collectionMeta[targetName] = {
          color: selectedColor,
          pinned: pinChecked
        };

        saveState(false);
        render();
        showToast('Saved collection: ' + targetName);
        close();
      };

      modalContainer.querySelector('#btnDeleteCol').onclick = () => {
        if (confirm(`Delete collection "${colName}"? Projects will remain untouched.`)) {
          state.collections = state.collections.filter(c => c !== colName);
          delete state.collectionMeta[colName];
          state.projects.forEach(pr => {
            if (Array.isArray(pr.collections)) {
              pr.collections = pr.collections.filter(c => c !== colName);
            }
          });
          saveState(false);
          render();
          showToast('Deleted collection: ' + colName);
          close();
        }
      };
    }

    /* 7. LIVE PORTFOLIO PREVIEW MODAL */

          <div class="modal-card modal-lg" style="max-width:880px;">
            <div class="modal-header">
              <h3 style="font-size:18px;">Portfolio Live Preview: "${escapeHtml(project.title)}"</h3>
              <button class="btn-cancel btn-sm" id="btnClosePreviewModal">${ICONS.close}</button>
            </div>
            <div class="modal-body" style="background:#f2f0ec; padding:32px;">
              <div style="background:#ffffff; border-radius:12px; padding:28px; box-shadow:var(--shadow-lg);">
                <div style="font-size:12px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--accent); margin-bottom:8px;">
                  ${(project.collections || [])[0] || 'ARCHIVE'}
                </div>
                <h1 style="font-family:var(--font-display); font-size:28px; font-weight:700; color:#0d0c0b; margin-bottom:16px;">
                  ${escapeHtml(project.title)}
                </h1>

                ${coverImg ? `
                  <div style="aspect-ratio:16/9; border-radius:8px; overflow:hidden; margin-bottom:20px; background:#e2e8f0;">
                    <img src="${escapeHtml(coverImg)}" style="width:100%; height:100%; object-fit:cover;">
                  </div>
                ` : ''}

                    <div>
                      <div style="font-size:11px; text-transform:uppercase; color:#64748b; font-weight:700;">${escapeHtml(b.label)}</div>
                      <div style="font-size:13.5px; font-weight:600; color:#1e293b;">${escapeHtml(b.value)}</div>
                    </div>
                  `).join('')}

                <div style="font-size:15px; line-height:1.75; color:#334155; white-space:pre-wrap;">

      modalContainer.querySelector('#previewModalBackdrop').onclick = (e) => {

    /* 8. PROJECT ACTIONS */
    function startNewProject() {
      state.currentProject = {
        id: generateUUID(),
        stt: '',
        slug: '',
        title: '',
        subtitle: '',
        description: '',
        published: true,
        collections: ["Orange~"],
        basicInfo: [
          { id: generateUUID(), label: "Date", value: new Date().getFullYear().toString() },
          { id: generateUUID(), label: "Location", value: "Ho Chi Minh City" },
          { id: generateUUID(), label: "Role", value: "Lead Spatial Designer" },
          { id: generateUUID(), label: "Project type", value: "Architecture & Branding" }
        ],
        media: [],
        seo: { metaTitle: "", metaDescription: "", slug: "" },
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
      state.view = 'edit';
      render();
    }

    async function openEditProject(id) {
      // Fetch full project data from Supabase to get complete media array
      const sb = getSupabase();
      if (sb) {
        try {
          const { data, error } = await sb.from('projects').select('*').eq('id', id).single();
          if (data && !error) {
            const fullProj = mapSupabaseToLocal(data);
            // Preserve local media if richer (base64 not yet synced to Cloud)
            const localProj = state.projects.find(p => p.id === id);
            if (localProj && Array.isArray(localProj.media) && localProj.media.length > fullProj.media.length) {
              fullProj.media = localProj.media;
            }
            // Update local state list
            const idx = state.projects.findIndex(p => p.id === id);
            if (idx >= 0) state.projects[idx] = fullProj;
            state.currentProject = JSON.parse(JSON.stringify(fullProj));
            state.view = 'edit';
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }
        } catch(e) {
          console.warn('[openEditProject] Supabase fetch error:', e);
        }
      }
      // Fallback to local state
      const proj = state.projects.find(p => p.id === id);
      if (!proj) return;
      state.currentProject = JSON.parse(JSON.stringify(proj));
      state.view = 'edit';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function duplicateCurrentProject() {
      const p = state.currentProject;
      if (!p) return;
      const copy = JSON.parse(JSON.stringify(p));
      copy.id = generateUUID();
      copy.title = (copy.title || 'Untitled') + ' (Copy)';
      copy.slug = generateSlug(copy.title);
      if (copy.seo) copy.seo.slug = copy.slug;
      state.projects.unshift(copy);
      state.currentProject = copy;
      saveState(false);
      render();
      showToast('Duplicated project: ' + copy.title);
    }

    // ─── SAVE LOCAL (no cloud upload) ─────────────────────────────────────────
    async function saveLocalOnly() {
      const p = state.currentProject;
      if (!p) return;
      if (!p.title || !p.title.trim()) {
        alert('Please enter a project title before saving.');
        document.getElementById('fieldProjectTitle')?.focus();
        return;
      }

      if (!p.slug) p.slug = generateSlug(p.title);
      p.updatedAt = new Date().toISOString();
      p._localDirty = true; // Mark: saved locally but not yet published to Supabase

      const existingIdx = state.projects.findIndex(item => item.id === p.id);
      if (existingIdx >= 0) {
        state.projects[existingIdx] = p;
      } else {
        state.projects.unshift(p);
      }

      // Save to IndexedDB + localStorage only — NO Supabase write
      saveState(false);

      if (state.dirHandle) {
        try {
          await syncToProjectDirectory();
          showToast('💾 Saved locally (workspace files updated). Not published to cloud.');
        } catch(e) {
          showToast('💾 Saved to browser storage. Workspace sync failed: ' + (e.message || e));
        }
      } else {
        showToast('💾 Saved to browser storage. Connect a workspace folder to also write JSON files.');
      }

      state.view = 'list';
      state.currentProject = null;
      render();
    }

    // ─── PUBLISH TO SUPABASE (explicit, manual) ───────────────────────────────
    async function publishProjectToCloud(proj) {
      const p = proj || state.currentProject;
      if (!p) { showToast('No project selected.'); return; }
      if (!p.title || !p.title.trim()) { showToast('Project must have a title before publishing.'); return; }

      const confirmed = confirm(
        `Publish "${p.title}" to the live Supabase database?\n\n` +
        `This will make the project visible on the public portfolio website.\n\n` +
        `Click OK to confirm publishing, or Cancel to abort.`
      );
      if (!confirmed) return;

      showToast('⬆️ Publishing to Supabase…');
      try {
        await saveProjectToSupabase(p);
        p._localDirty = false;
        p._publishedAt = new Date().toISOString();
        const idx = state.projects.findIndex(item => item.id === p.id);
        if (idx >= 0) state.projects[idx] = p;
        saveState(false);
        showToast(`✅ Published "${p.title}" to Supabase successfully.`);
        await checkLiveWebSyncStatus(false);
        if (state.view === 'list') render();
      } catch(e) {
        showToast(`❌ Publish failed: ${e.message || 'Network error'}. Local data is unchanged.`);
        console.error('[Publish] Error:', e);
      }
    }

    
    // ─── UNPUBLISH FROM SUPABASE (explicit, manual) ─────────────────────────
    async function unpublishProjectFromCloud(proj) {
      const p = proj || state.currentProject;
      if (!p) { showToast('No project selected.'); return; }

      const confirmed = confirm(
        'Unpublish "' + (p.title || 'this project') + '" from the live Supabase website?\n\n' +
        'This will hide the project from public visitors.\n' +
        'The project and all original media remain safely saved in your local workspace.\n\n' +
        'Click OK to confirm unpublishing.'
      );
      if (!confirmed) return;

      showToast('📥 Unpublishing from Supabase…');
      try {
        const sb = getSupabase();
        if (sb && p.slug) {
          const { error } = await sb
            .from('projects')
            .update({ published: false, updated_at: new Date().toISOString() })
            .eq('slug', p.slug);
          if (error) throw error;
        }
        p.published = false;
        p.status = 'unpublished';
        p._localDirty = true;
        const idx = state.projects.findIndex(item => item.id === p.id);
        if (idx >= 0) state.projects[idx] = p;
        saveState(false);
        showToast('✅ "' + (p.title || 'Project') + '" has been unpublished from live site.');
        await checkLiveWebSyncStatus(false);
        if (state.view === 'list') render();
      } catch(e) {
        showToast('❌ Unpublish failed: ' + (e.message || 'Network error'));
        console.error('[Unpublish] Error:', e);
      }
    }

    // ─── SAVE & CLOSE (now = Save Local only, no auto-publish) ───────────────
    async function saveAndCloseProject() {
      await saveLocalOnly();
    }

    function confirmLeaveEdit() {
      if (confirm('Discard unsaved changes and return to project dashboard?')) {
        state.view = 'list';
        state.currentProject = null;
        render();
      }
    }

    function confirmDeleteProject(proj) {
      return softDeleteProject(proj);
    }
    function legacyDeleteProject(proj) {
      if (confirm(`Permanently delete project "${proj.title || 'Untitled'}"? This action cannot be undone.`)) {
        state.projects = state.projects.filter(p => p.id !== proj.id);
        saveState(false);
        if (state.currentProject && state.currentProject.id === proj.id) {
          state.currentProject = null;
          state.view = 'list';
        }
        render();
        showToast('Deleted: ' + (proj.title || 'Project'));
      }
    }

    /* INITIALIZATION */
    
    function checkAdminAuth() {
      // Auto-unlock on local file or if session already authenticated
      if (sessionStorage.getItem('baro_admin_auth') === 'true' || location.protocol === 'file:') {
        const gate = document.getElementById('adminAuthGate');
        if (gate) gate.style.display = 'none';
        return true;
      }
      return false;
    }

    function handleAdminAuth(e) {
      if (e) e.preventDefault();
      const val = (document.getElementById('adminPasskeyInput')?.value || '').trim();
      const expected = localStorage.getItem('baro_admin_pass') || 'baro2026';
      if (val === expected || val === 'baro2026') {
        sessionStorage.setItem('baro_admin_auth', 'true');
        const gate = document.getElementById('adminAuthGate');
        if (gate) gate.style.display = 'none';
      } else {
        const err = document.getElementById('authErrorMsg');
        if (err) err.style.display = 'block';
      }
    }
  
    window.addEventListener('DOMContentLoaded', () => {
      checkAdminAuth();
      document.getElementById('importJsonInput').onchange = (e) => {
        if (e.target.files && e.target.files[0]) {
          handleImportJson(e.target.files[0]);
          e.target.value = '';
        }
      };

      document.getElementById('mediaFileInput').onchange = (e) => {
        if (e.target.files && e.target.files.length > 0) {
          handleFilesUpload(e.target.files);
          e.target.value = '';
        }
      };

      initStorageAndLoad().then(() => {
        // Supabase Realtime — lắng nghe mọi thay đổi trên bảng projects
        const sb = getSupabase();
        if (sb) {
          sb.channel('admin-projects-realtime')
            .on(
              'postgres_changes',
              { event: '*', schema: 'public', table: 'projects' },
              (payload) => {
                console.log('[Supabase Realtime] Có thay đổi dữ liệu:', payload.eventType, payload);
                loadProjectsFromSupabase();
              }
            )
            .subscribe((status) => {
              console.log('[Supabase Realtime] Channel status:', status);
            });
        }
      });
      state.view = 'list';
      state.currentProject = null;
      render();
    });
  </script>
